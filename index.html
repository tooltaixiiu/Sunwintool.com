<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐼 TOOL BẢO NAM</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #1a0a1a;
            font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
            user-select: none;
            -webkit-text-size-adjust: 100%;
            touch-action: manipulation;
        }

        #game {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            z-index: 1;
        }

        #key-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #ffe6f0, #ffcce6, #ffb3d9);
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #key-overlay.fade-out {
            opacity: 0;
            transform: scale(1.08);
            pointer-events: none;
        }

        .key-card {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 20px 40px rgba(219, 112, 147, 0.25);
            border: 1px solid rgba(255, 182, 193, 0.6);
            text-align: center;
            position: relative;
            transform: translateY(0);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #key-overlay.fade-out .key-card {
            transform: translateY(-20px);
        }

        .key-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #d81b60;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            font-family: 'Orbitron', sans-serif;
        }

        .key-subtitle {
            font-size: 0.8rem;
            color: #ad1457;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .avatar-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #fff;
        }

        .key-input-box {
            width: 100%;
            background: #ffffff;
            border: 1px solid #f8bbd0;
            border-radius: 12px;
            padding: 12px 16px;
            color: #880e4f;
            text-align: center;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            outline: none;
            margin-bottom: 15px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
            transition: all 0.2s;
            font-family: 'Share Tech Mono', monospace;
        }

        .key-input-box:focus {
            border-color: #ff1493;
            box-shadow: 0 0 8px rgba(255, 20, 147, 0.3), inset 0 2px 4px rgba(0,0,0,0.03);
        }

        .key-input-box::placeholder {
            color: #db7093;
            font-weight: 400;
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff69b4, #d81b60);
            border: none;
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(216, 27, 96, 0.35);
            transition: transform 0.1s, opacity 0.2s;
            font-family: 'Orbitron', sans-serif;
        }

        .login-btn:active { transform: scale(0.98); }
        .login-btn:hover { opacity: 0.95; }

        .error-msg {
            color: #d32f2f;
            font-size: 0.75rem;
            margin-top: 10px;
            font-weight: 600;
            min-height: 18px;
        }

        .footer-brand {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #880e4f;
            letter-spacing: 0.5px;
            font-weight: 700;
            opacity: 0.85;
            font-family: 'Orbitron', sans-serif;
        }

        #tool-panel {
            position: fixed;
            top: 75px;
            left: 20px;
            z-index: 9999;
            cursor: grab;
            width: 320px;
            max-width: 90vw;
            filter: drop-shadow(0 0 30px rgba(0, 150, 255, 0.3));
            transition: transform 0.2s, opacity 0.2s;
            display: none;
        }
        #tool-panel:active { cursor: grabbing; }
        #tool-panel.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9);
        }

        .sunwin-card {
            pointer-events: auto !important;
            width: 100%;
            background: rgba(10, 18, 35, 0.94);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 162, 255, 0.5);
            box-shadow: 0 0 25px rgba(0, 120, 255, 0.3), inset 0 0 15px rgba(0, 162, 255, 0.1);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 162, 255, 0.2);
            padding-bottom: 5px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: #00d2ff;
            letter-spacing: 0.5px;
        }
        .header-actions {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .logout-key-btn {
            background: rgba(255, 165, 0, 0.2);
            border: 1px solid rgba(255, 165, 0, 0.5);
            color: #ffb703;
            font-size: 9px;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
        }
        .logout-key-btn:hover { background: rgba(255, 165, 0, 0.4); color: #fff; }

        .modal-header .close-btn {
            background: #0077ff;
            color: #fff;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .card-timer-sub {
            font-size: 10px;
            color: #ffb703;
            font-weight: 600;
            background: rgba(255, 183, 3, 0.1);
            border: 1px solid rgba(255, 183, 3, 0.3);
            border-radius: 6px;
            padding: 4px 8px;
            text-align: center;
            letter-spacing: 0.5px;
            font-family: 'Share Tech Mono', monospace;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .input-label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #8ab4f8;
            font-weight: 600;
        }
        .input-wrapper {
            position: relative;
            background: rgba(0, 5, 15, 0.6);
            border: 1px solid rgba(0, 162, 255, 0.35);
            border-radius: 6px;
            padding: 4px 8px;
            display: flex;
            align-items: center;
        }
        .input-wrapper input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
        }
        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
        }

        .analyze-btn {
            width: 100%;
            background: linear-gradient(90deg, #0056b3, #00a2ff, #0056b3);
            background-size: 200% auto;
            border: none;
            border-radius: 6px;
            color: #fff;
            padding: 7px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 162, 255, 0.4);
            transition: 0.3s;
            text-align: center;
        }
        .analyze-btn:hover {
            background-position: right center;
            box-shadow: 0 0 20px rgba(0, 162, 255, 0.8);
        }
        .analyze-btn:active { transform: scale(0.97); }

        .result-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: rgba(0, 5, 15, 0.4);
            border-radius: 8px;
            padding: 6px;
            border: 1px solid rgba(0, 162, 255, 0.15);
        }
        .result-title {
            font-size: 9px;
            color: #8ab4f8;
            display: flex;
            justify-content: space-between;
            font-family: 'Orbitron', sans-serif;
        }
        .result-boxes {
            display: flex;
            gap: 6px;
        }
        .res-card {
            flex: 1;
            background: rgba(5, 15, 30, 0.8);
            border: 1px solid rgba(0, 162, 255, 0.3);
            border-radius: 6px;
            padding: 6px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 3px;
            transition: all 0.3s;
        }
        .res-card.active-choice {
            border-color: #00ff88;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
            background: rgba(0, 40, 20, 0.6);
        }
        .res-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 900;
            color: #fff;
        }
        .res-percent {
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            font-weight: bold;
            color: #00d2ff;
        }
        .res-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .res-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00d2ff, #00ff88);
            transition: width 0.5s ease;
        }

        #tool-toggle-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 10002;
            background: rgba(10, 20, 40, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 162, 255, 0.6);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            color: #00d2ff;
            font-size: 20px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.4);
            transition: all 0.3s ease;
        }
        #tool-toggle-btn:hover {
            background: rgba(0, 162, 255, 0.3);
            transform: scale(1.1);
        }

        #stats-panel {
            position: fixed;
            top: 15px;
            left: 70px;
            z-index: 10000;
            background: rgba(10, 20, 40, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 162, 255, 0.5);
            border-radius: 12px;
            padding: 8px 14px;
            display: none;
            align-items: center;
            gap: 12px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            box-shadow: 0 0 20px rgba(0, 162, 255, 0.3);
            user-select: none;
        }
        #stats-panel.hidden {
            transform: translateY(-120%);
            opacity: 0;
            pointer-events: none;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 700;
        }
        .stat-item .value.green { color: #00ff88; }
        .stat-item .value.red { color: #ff4444; }
        .stat-item .value.gold { color: #ffd700; }
        .stat-item .value.white { color: #ffffff; }

        #toggle-stats {
            background: rgba(0, 162, 255, 0.2);
            border: 1px solid rgba(0, 162, 255, 0.4);
            color: #fff;
            padding: 1px 6px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 10px;
        }

        #stats-toggle-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 10001;
            background: rgba(10, 20, 40, 0.85);
            border: 1px solid rgba(0, 162, 255, 0.5);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #stats-toggle-btn.show { display: flex; }

        #history-bar {
            position: fixed;
            bottom: 15px;
            right: 15px;
            z-index: 9998;
            display: none;
            gap: 5px;
            align-items: flex-end;
            background: rgba(10, 20, 40, 0.8);
            backdrop-filter: blur(10px);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid rgba(0, 162, 255, 0.3);
        }
        .hist-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-width: 28px;
        }
        .hist-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 900;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .hist-dot.tai { background: radial-gradient(circle at 30% 30%, #00ffaa, #008855); box-shadow: 0 0 8px rgba(0,255,170,0.5); }
        .hist-dot.xiu { background: radial-gradient(circle at 30% 30%, #ff5555, #aa2222); box-shadow: 0 0 8px rgba(255,85,85,0.5); }
        .hist-dot.wait { background: #333; color: #666; }
        .hist-label { font-size: 7px; color: #8ab4f8; font-weight: 700; }
    </style>
</head>
<body>

    <div id="key-overlay">
        <div class="key-card">
            <div class="key-title">BẢO NAM</div>
            <div class="key-subtitle">
                <span>🔒 Nhập Key Bản Quyền Tool</span>

    <iframe id="game" src="https://web-sunwin.juegos/?Affid=Sunwin"></iframe>

    <div id="tool-panel">
        <div class="sunwin-card">
            <div class="modal-header">
                <span>⚡ BẢO NAM VIP 2.1 ⚡</span>
                <div class="header-actions">
                    <button class="logout-key-btn" id="logoutKeyBtn">ĐĂNG XUẤT</button>
                    <button class="close-btn" id="close-tool-btn">×</button>

                </div>
            </div>

            <div class="input-group">
                <div class="input-label">
                    <span>🔀 HOẶC NHẬP CHUỖI T-X</span>

                    <input type="text" id="manual-chain-input" placeholder="V D :   T X X T X T X" />
                </div>

                <div class="result-title">

                <div class="result-boxes">
                    <div class="res-card" id="card-tai">

    <div id="history-bar">
        <div class="hist-item"><div class="hist-dot wait">?</div><span class="hist-label">-4</span></div>
        <div class="hist-item"><div class="hist-dot wait">?</div><span class="hist-label">-3</span></div>
        <div class="hist-item"><div class="hist-dot wait">?</div><span class="hist-label">-2</span></div>
        <div class="hist-item"><div class="hist-dot wait">?</div><span class="hist-label">-1</span></div>
        <div class="hist-item"><div class="hist-dot wait">?</div><span class="hist-label">HIỆN</span></div>
    </div>

    <script>
        let expiryTimer = null;
        let countdownInterval = null;

        // DANH SÁCH KEY CHUẨN XÁC 100%
        const KEY_DATABASE = {
            "sunwin-1h": 1 * 60 * 60 * 1000,          // 1 giờ
            "sunwin-1d": 24 * 60 * 60 * 1000,         // 1 ngày
            "sunwin-1w": 7 * 24 * 60 * 60 * 1000,     // 1 tuần
            "sunwin-1m": 30 * 24 * 60 * 60 * 1000,    // 1 tháng
            "sunwin-1y": 365 * 24 * 60 * 60 * 1000    // 1 năm
        };

        function startCountdown(startTime, keyDuration) {
            if (countdownInterval) clearInterval(countdownInterval);

            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const elapsed = now - startTime;
                const remaining = keyDuration - elapsed;
                const timerDisplay = document.getElementById('keyTimerDisplay');

                if (remaining <= 0) {
                    timerDisplay.innerText = '⏰ Key đã hết hạn! Đang văng ra...';
                    clearInterval(countdownInterval);
                    forceLogout();
                } else {
                    const totalSeconds = Math.floor(remaining / 1000);
                    const days = Math.floor(totalSeconds / (3600 * 24));
                    const hours = Math.floor((totalSeconds % (3600 * 24)) / 3600);
                    const minutes = Math.floor((totalSeconds % 3600) / 60);
                    const seconds = totalSeconds % 60;

                    let timeString = '';
                    if (days > 0) timeString += `${days}n `;
                    if (hours > 0 || days > 0) timeString += `${hours}h `;
                    if (minutes > 0 || hours > 0 || days > 0) timeString += `${minutes}p `;
                    timeString += `${seconds}s`;

                    timerDisplay.innerText = `⏳ Key còn lại: ${timeString}`;
                }
            }, 1000);
        }

        function forceLogout() {
            localStorage.clear(); 
            if (expiryTimer) clearTimeout(expiryTimer);
            if (countdownInterval) clearInterval(countdownInterval);

            const overlay = document.getElementById('key-overlay');
            const toolPanel = document.getElementById('tool-panel');
            const toolToggleBtn = document.getElementById('tool-toggle-btn');
            const statsPanel = document.getElementById('stats-panel');
            const historyBar = document.getElementById('history-bar');

            toolPanel.style.display = 'none';
            toolToggleBtn.style.display = 'none';
            statsPanel.style.display = 'none';
            historyBar.style.display = 'none';

            overlay.style.display = 'flex';
            overlay.classList.remove('fade-out');
            document.getElementById('errorMsg').innerText = '❌ Phiên đăng nhập đã kết thúc. Vui lòng nhập lại key!';
        }

        function grantAccess(savedTime, keyDuration) {
            const overlay = document.getElementById('key-overlay');
            const toolPanel = document.getElementById('tool-panel');
            const toolToggleBtn = document.getElementById('tool-toggle-btn');
            const statsPanel = document.getElementById('stats-panel');
            const historyBar = document.getElementById('history-bar');

            overlay.classList.add('fade-out');
            setTimeout(() => {
                overlay.style.display = 'none';
                toolPanel.style.display = 'block';
                toolToggleBtn.style.display = 'flex';
                statsPanel.style.display = 'flex';
                historyBar.style.display = 'flex';
            }, 550);

            startCountdown(savedTime, keyDuration);

            const now = new Date().getTime();
            const elapsed = now - savedTime;
            const totalTimeout = keyDuration - elapsed;

            if (expiryTimer) clearTimeout(expiryTimer);
            expiryTimer = setTimeout(() => {
                forceLogout();
            }, totalTimeout > 0 ? totalTimeout : 0);
        }

        function checkActiveKey() {
            const savedTimeStr = localStorage.getItem('baonam_key_time');
            const savedKey = localStorage.getItem('baonam_key_val');
            const savedDurStr = localStorage.getItem('baonam_key_dur');

            if (savedTimeStr && savedKey && KEY_DATABASE[savedKey]) {
                const savedTime = parseInt(savedTimeStr);
                const keyDuration = parseInt(savedDurStr || KEY_DATABASE[savedKey]);
                const now = new Date().getTime();
                const elapsed = now - savedTime;

                if (elapsed < keyDuration) {
                    const overlay = document.getElementById('key-overlay');
                    const toolPanel = document.getElementById('tool-panel');
                    const toolToggleBtn = document.getElementById('tool-toggle-btn');
                    const statsPanel = document.getElementById('stats-panel');
                    const historyBar = document.getElementById('history-bar');

                    overlay.style.display = 'none';
                    toolPanel.style.display = 'block';
                    toolToggleBtn.style.display = 'flex';
                    statsPanel.style.display = 'flex';
                    historyBar.style.display = 'flex';

                    startCountdown(savedTime, keyDuration);

                    const totalTimeout = keyDuration - elapsed;
                    expiryTimer = setTimeout(() => {
                        forceLogout();
                    }, totalTimeout > 0 ? totalTimeout : 0);
                } else {
                    forceLogout();
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkActiveKey();
            initTool();
        });

        // Xử lý sự kiện đăng nhập key chuẩn xác
        document.getElementById('loginKeyBtn').addEventListener('click', () => {
            const inputVal = document.getElementById('licenseKeyInput').value;
            // Chuẩn hóa key: loại bỏ toàn bộ khoảng trắng thừa và chuyển thành chữ thường
            const val = inputVal ? inputVal.trim().toLowerCase() : '';
            const err = document.getElementById('errorMsg');

            if (KEY_DATABASE[val]) {
                const currentTime = new Date().getTime();
                const keyDuration = KEY_DATABASE[val];

                localStorage.setItem('baonam_key_val', val);
                localStorage.setItem('baonam_key_time', currentTime.toString());
                localStorage.setItem('baonam_key_dur', keyDuration.toString());

                document.getElementById('licenseKeyInput').value = '';
                grantAccess(currentTime, keyDuration);
            } else {
                err.innerText = '❌ Key không hợp lệ! Vui lòng kiểm tra lại.';
                setTimeout(() => { err.innerText = ''; }, 3500);
            }
        });

        document.getElementById('licenseKeyInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginKeyBtn').click();
            }
        });

        document.getElementById('logoutKeyBtn').addEventListener('click', () => {
            forceLogout();
        });

        const toolPanel = document.getElementById("tool-panel");
        let drag = false, sx = 0, sy = 0;

        toolPanel.addEventListener("mousedown", e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
            drag = true;
            sx = e.clientX - toolPanel.offsetLeft;
            sy = e.clientY - toolPanel.offsetTop;
        });
        toolPanel.addEventListener("touchstart", e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
            drag = true;
            const t = e.touches[0];
            sx = t.clientX - toolPanel.offsetLeft;
            sy = t.clientY - toolPanel.offsetTop;
        }, { passive: true });

        document.addEventListener("mousemove", e => {
            if (!drag) return;
            toolPanel.style.left = e.clientX - sx + "px";
            toolPanel.style.top = e.clientY - sy + "px";
        });
        document.addEventListener("touchmove", e => {
            if (!drag) return;
            const t = e.touches[0];
            toolPanel.style.left = t.clientX - sx + "px";
            toolPanel.style.top = t.clientY - sy + "px";
        }, { passive: false });

        document.addEventListener("mouseup", () => { drag = false; });
        document.addEventListener("touchend", () => { drag = false; });

        const toolToggleBtn = document.getElementById('tool-toggle-btn');
        const closeToolBtn = document.getElementById('close-tool-btn');

        toolToggleBtn.addEventListener('click', () => {
            toolPanel.classList.toggle('hidden');
        });
        closeToolBtn.addEventListener('click', () => {
            toolPanel.classList.add('hidden');
        });

        const statsPanel = document.getElementById('stats-panel');
        const toggleStats = document.getElementById('toggle-stats');
        const statsToggleBtn = document.getElementById('stats-toggle-btn');

        toggleStats.addEventListener('click', () => {
            statsPanel.classList.add('hidden');
            statsToggleBtn.classList.add('show');
        });
        statsToggleBtn.addEventListener('click', () => {
            statsPanel.classList.remove('hidden');
            statsToggleBtn.classList.remove('show');
        });

        let stats = { total: 0, wins: 0, losses: 0 };
        let manualHistory = [];

        function updateStats(isWin) {
            stats.total++;
            if (isWin) stats.wins++; else stats.losses++;
            document.getElementById('total-games').textContent = stats.total;
            document.getElementById('wins').textContent = stats.wins;
            document.getElementById('losses').textContent = stats.losses;
            let rate = stats.total > 0 ? Math.round((stats.wins / stats.total) * 100) : 0;
            document.getElementById('win-rate').textContent = rate + '%';
        }

        function handlePredict() {
            const phienInput = document.getElementById('manual-phien-input').value.trim();
            const chainInput = document.getElementById('manual-chain-input').value.trim();

            if (phienInput.length === 0 && chainInput.length === 0) {
                alert("Vui lòng nhập mã phiên hoặc chuỗi T-X để phân tích!");
                return;
            }

            const taiPct = Math.floor(Math.random() * 38) + 32;
            const xiuPct = 100 - taiPct;
            const isTai = taiPct >= xiuPct;
            const choice = isTai ? 'TÀI' : 'XỈU';

            document.getElementById('pct-tai').textContent = taiPct + '%';
            document.getElementById('pct-xiu').textContent = xiuPct + '%';
            document.getElementById('fill-tai').style.width = taiPct + '%';
            document.getElementById('fill-xiu').style.width = xiuPct + '%';

            const cardTai = document.getElementById('card-tai');
            const cardXiu = document.getElementById('card-xiu');

            if (isTai) {
                cardTai.classList.add('active-choice');
                cardXiu.classList.remove('active-choice');
            } else {
                cardXiu.classList.add('active-choice');
                cardTai.classList.remove('active-choice');
            }

            const sessionNum = phienInput ? parseInt(phienInput) : (manualHistory.length ? manualHistory[manualHistory.length - 1].phien + 1 : 1000000);
            
            const randomWin = Math.random() >= 0.45;
            updateStats(randomWin);

            manualHistory.push({ phien: sessionNum, choice: choice });
            if (manualHistory.length > 60) manualHistory.shift();
            updateHistoryUI();

            if (phienInput && !isNaN(phienInput)) {
                const nextVal = parseInt(phienInput) + 1;
                document.getElementById('manual-phien-input').value = String(nextVal).padStart(7, '0');
                document.getElementById('char-count').textContent = String(nextVal).length + '/7';
            }
        }

        function updateHistoryUI() {
            const items = document.querySelectorAll('.hist-dot');
            const len = manualHistory.length;

            for (let i = 0; i < 5; i++) {
                const index = len - 5 + i;
                if (index >= 0 && index < len) {
                    const data = manualHistory[index];
                    const isTai = data.choice === 'TÀI';
                    items[i].textContent = isTai ? 'T' : 'X';
                    items[i].className = `hist-dot ${isTai ? 'tai' : 'xiu'}`;
                } else {
                    items[i].textContent = '?';
                    items[i].className = 'hist-dot wait';
                }
            }
        }

        function initTool() {
            const phienInput = document.getElementById('manual-phien-input');
            phienInput.addEventListener('input', () => {
                if (phienInput.value.length > 7) {
                    phienInput.value = phienInput.value.slice(0, 7);
                }
                document.getElementById('char-count').textContent = phienInput.value.length + '/7';
            });

            document.getElementById('btn-predict').addEventListener('click', handlePredict);
            phienInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handlePredict(); });
        }
    </script>
</body>
</html>
